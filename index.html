  }

  .b-dl .txt{display:flex;flex-direction:column;line-height:1.2}
  .b-dl .big{font-size:21px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
  .b-dl .small{font-size:12px;font-weight:600;color:#6b1a00;margin-top:2px}
  .b-dl::after{
    content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);
    transform:skewX(-20deg);animation:shine 2.6s infinite;
  }
  @keyframes shine{0%{left:-70%}60%,100%{left:130%}}
  @keyframes drop{0%,100%{transform:translateY(-3px)}50%{transform:translateY(3px)}}
  @keyframes wiggle{0%,88%,100%{transform:scale(1)}92%{transform:scale(1.04) rotate(-1deg)}96%{transform:scale(1.04) rotate(1deg)}}
  @keyframes glow{0%{box-shadow:0 0 0 0 rgba(255,200,0,.75),0 10px 26px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.7)}70%{box-shadow:0 0 0 18px rgba(255,200,0,0),0 10px 26px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.7)}100%{box-shadow:0 0 0 0 rgba(255,200,0,0),0 10px 26px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.7)}}
  .b-dl svg{fill:currentColor}
  .b-wa{background:linear-gradient(90deg,#25d366,#128c7e)}
  .b-call{background:linear-gradient(90deg,#36d1dc,#5b86e5)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(60,179,113,.7),0 6px 16px rgba(0,0,0,.35)}70%{box-shadow:0 0 0 14px rgba(60,179,113,0),0 6px 16px rgba(0,0,0,.35)}100%{box-shadow:0 0 0 0 rgba(60,179,113,0),0 6px 16px rgba(0,0,0,.35)}}
  .features{
    margin:26px auto 0;max-width:420px;background:rgba(0,0,0,.35);border-radius:22px;padding:22px 18px;
    display:flex;flex-direction:column;gap:16px;
  }
  .f{display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:500}
  .f svg{width:20px;height:20px;fill:#fff}
  .foot{margin-top:22px;font-size:12px;color:#f3bcbc}
</style>

<script>
(function(){
  var loadedAt = Date.now();
  var interacted = false;      // real touch / scroll / mouse hua ya nahi
  var KEY = 'kp_lead_sent';

  ['touchstart','scroll','mousemove','keydown'].forEach(function(ev){
    window.addEventListener(ev, function(){ interacted = true; }, {passive:true, once:true});
  });

  // WhatsApp + Call links set karo
  var waUrl = 'https://wa.me/' + CONFIG.whatsappNumber + '?text=' + encodeURIComponent(CONFIG.waMessage);
  document.getElementById('btnWhatsapp').href = waUrl;
  document.getElementById('btnCall').href = 'tel:' + CONFIG.callNumber;
  var dl = document.getElementById('btnDownload');
  dl.href = CONFIG.apkFile; dl.setAttribute('download', CONFIG.apkFile);

  // Fake click protection: Lead tabhi count hoga jab
  // 1) click asli user ne kiya (isTrusted)  2) page par kam se kam minSeconds ruka
  // 3) page visible hai  4) user ne page se interact kiya  5) is session me pehle Lead nahi gaya
  function fireLead(e){
    try{
      if(!e || !e.isTrusted) return;
      if(document.hidden) return;
      if((Date.now() - loadedAt) < CONFIG.minSeconds * 1000) return;
      if(!interacted && e.detail === 0) return;
      if(sessionStorage.getItem(KEY)) return;
      if(typeof fbq === 'function'){
        fbq('track','Lead');
        sessionStorage.setItem(KEY,'1');
      }
    }catch(err){}
  }

  ['btnDownload','btnWhatsapp','btnCall'].forEach(function(id){
    document.getElementById(id).addEventListener('click', fireLead);
  });
})();
</script>
